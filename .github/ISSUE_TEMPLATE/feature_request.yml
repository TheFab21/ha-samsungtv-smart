name: Feature request
description: Suggest something the integration should be able to do.
labels: ["Feature Request"]
body:
  - type: markdown
    attributes:
      value: |
        Describe **what you want to achieve**, not only the implementation you
        have in mind — there is often a shorter route than the one imagined.

        > **Who answers here.** This project is maintained by one person, whose
        > first language is not English. Most replies are drafted with
        > [Claude Code](https://claude.ai/code), an AI assistant, and each one is
        > reviewed and approved by the maintainer before it is posted. They end
        > with a *Generated by Claude Code* line.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      description: >-
        Many requests are for something that already exists — a slider, a
        select or an action that is only one click away once you know its name.
      options:
        - label: >-
            I checked the README's
            [Entities](https://github.com/TheFab21/ha-samsungtv-smart#entities)
            and [Services](https://github.com/TheFab21/ha-samsungtv-smart#services)
            sections, and what I want is not there.
          required: true
        - label: >-
            I looked at the entities this integration already created for my TV
            (Settings → Devices & services → SamsungTV Smart → my TV), including
            the disabled ones.
          required: true
        - label: I searched the existing issues, open and closed, for the same request.
          required: true

  - type: textarea
    id: goal
    attributes:
      label: What do you want to be able to do?
      description: The outcome, in your own words.
      placeholder: >-
        Loop a video I stream from Home Assistant, without an automation that
        restarts it on every state change.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: How do you do it today, and why is that unsatisfying?
    validations:
      required: false

  - type: input
    id: tv-model
    attributes:
      label: TV model this is for
      description: >-
        Full reference. Samsung's capabilities differ sharply by generation, and
        what exists on a 2024 Frame often does not on a 2019 set — and the
        reverse.
      placeholder: QE55LS03DAUXXH
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: Which channel would this use, if you know?
      options:
        - I do not know
        - SmartThings (cloud)
        - Local WebSocket / remote keys
        - IP Control (JSON-RPC, port 1515/1516)
        - UPnP / DLNA (media playback)
        - Frame Art API
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Expect to be asked to test.** Samsung publishes no developer
        documentation for consumer TVs, so a capability usually cannot be
        confirmed without trying it against a real set. If your request depends
        on one, you will likely be handed a `curl` command to run against your own
        TV — that is normally the fastest route to a yes or a no, and several
        features in this integration exist because a user was willing to run one.

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Links to other projects doing this, API documentation, screenshots.
    validations:
      required: false
