name: "Release"

on:
  release:
    types:
      - "published"

permissions:
  contents: write

jobs:
  update-manifest:
    name: "Update manifest version"
    # Stable releases only. A pre-release used to target a dev branch derived
    # from its version line (8.9.1 -> v8.9-dev); those branches stopped being
    # created once everything was cut from master, so every pre-release failed
    # here with "couldn't find remote ref refs/heads/v8.9-dev" and took the
    # Release job down with it (4 of 4 pre-releases in the 8.9 line). The
    # manifest version is already set in the PR that ships the change, and the
    # zip below sets it from the tag regardless, so there is nothing to push
    # for a pre-release.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout master"
        uses: actions/checkout@v4
        with:
          ref: refs/heads/master
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Update manifest.json"
        run: |
          jq '.version = "${{ github.event.release.tag_name }}"' \
            custom_components/samsungtv_smart/manifest.json > tmp.json
          mv tmp.json custom_components/samsungtv_smart/manifest.json
      - name: "Commit and push"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/samsungtv_smart/manifest.json
          git diff --staged --quiet || \
            git commit -m "chore: bump manifest version to ${{ github.event.release.tag_name }}"
          git push origin refs/heads/master

  release:
    name: "Release"
    runs-on: ubuntu-latest
    # Runs for stable and pre-releases alike. `always()` keeps it going when
    # update-manifest was skipped (a pre-release); a failure or a cancellation
    # there still stops it.
    needs: [update-manifest]
    if: ${{ always() && contains(fromJSON('["success", "skipped"]'), needs.update-manifest.result) }}
    steps:
      - name: "Checkout the release tag"
        uses: actions/checkout@v4
        with:
          # The tag, not a branch: the asset must be the code that was
          # released. Checking out a branch head shipped whatever had landed
          # on it since, and needed a branch to exist at all.
          ref: ${{ github.event.release.tag_name }}
      - name: "Set manifest version from tag (authoritative)"
        # Force the version inside the artifact to match the release tag, so
        # the zip is correct even if the tag was cut before the bump landed.
        run: |
          jq '.version = "${{ github.event.release.tag_name }}"' \
            custom_components/samsungtv_smart/manifest.json > tmp.json
          mv tmp.json custom_components/samsungtv_smart/manifest.json
          echo "manifest version is now:"
          jq -r '.version' custom_components/samsungtv_smart/manifest.json
      - name: "ZIP the integration directory"
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/samsungtv_smart"
          zip samsungtv_smart.zip -r ./
      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v2.0.8
        with:
          files: ${{ github.workspace }}/custom_components/samsungtv_smart/samsungtv_smart.zip
