# Dependabot keeps the CI/dev pins (requirements*.txt) and the workflow
# actions current, and groups the PRs so security bumps arrive together
# rather than one noisy PR per advisory. The integration ships the
# dependencies in manifest.json; these files are the test/lint toolchain.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns:
          - "*"
    # homeassistant, its test helper (pytest-homeassistant-custom-component)
    # and pytest are a coupled set: the helper pins homeassistant and pytest to
    # exact versions, and the homeassistant line past 2026.2.3 needs Python
    # 3.14 while CI runs 3.13. Dependabot bumps each independently, which only
    # yields unresolvable PRs, so we bump these three together by hand.
    ignore:
      - dependency-name: "homeassistant"
      - dependency-name: "pytest"
      - dependency-name: "pytest-homeassistant-custom-component"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
