# ============================================
# Frame Art Gallery Configuration
# ============================================
# Add this to your configuration.yaml
#
# This configuration provides:
# - Template sensors for gallery management
# - Input helpers for UI controls
# ============================================

# ===== FOLDER SENSORS =====
# Nothing to declare: the integration creates, for each Frame,
#   sensor.<tv_name>_personal / _store / _other
# with `file_list` and `file_urls` attributes. Since 9.6.0 the thumbnails are
# in /config/.storage/samsungtv_smart/frame_art/<entry_id>/, out of www (which
# Home Assistant serves without login), so a `platform: folder` sensor on
# /config/www/frame_art/... finds nothing: remove any you had.
#
# The template sensors below take each picture's URL from `file_urls`
# (those URLs carry a token that changes at each restart, so never build them
# by hand). Replace `samsung_frame` with your TV's entity prefix.

# ===== TEMPLATE SENSORS =====
template:
  - sensor:
      # Personal Photo Gallery
      - name: "Frame Art Personal Gallery"
        unique_id: frame_art_personal_gallery
        state: >
          {% set list = state_attr('sensor.samsung_frame_art_list', 'content_list') or [] %}
          {% set personal = list | selectattr('category_id', 'eq', 'MY-C0002') | list %}
          {{ personal | length }}
        attributes:
          images: >
            {% set urls = (state_attr('sensor.samsung_frame_personal', 'file_urls') or [])
               + (state_attr('sensor.samsung_frame_store', 'file_urls') or [])
               + (state_attr('sensor.samsung_frame_other', 'file_urls') or []) %}
            {% set ns = namespace(images=[]) %}
            {% for item in state_attr('sensor.samsung_frame_art_list', 'content_list') or [] %}
              {% if item.category_id == 'MY-C0002' %}
                {% set url = urls | select('search', '/' ~ item.content_id ~ '\\.jpg\\?') | first | default('') %}
                {% if url %}
                {% set ns.images = ns.images + [{
                  'path': url,
                  'filename': item.content_id ~ '.jpg',
                  'name': item.content_id,
                  'content_id': item.content_id
                }] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.images }}

      # Art Store Gallery
      - name: "Frame Art Store Gallery"
        unique_id: frame_art_store_gallery
        state: >
          {% set list = state_attr('sensor.samsung_frame_art_list', 'content_list') or [] %}
          {% set store = list | selectattr('content_id', 'match', '^SAM-') | list %}
          {{ store | length }}
        attributes:
          images: >
            {% set urls = (state_attr('sensor.samsung_frame_personal', 'file_urls') or [])
               + (state_attr('sensor.samsung_frame_store', 'file_urls') or [])
               + (state_attr('sensor.samsung_frame_other', 'file_urls') or []) %}
            {% set ns = namespace(images=[]) %}
            {% for item in state_attr('sensor.samsung_frame_art_list', 'content_list') or [] %}
              {% if item.content_id.startswith('SAM-') %}
                {% set url = urls | select('search', '/' ~ item.content_id ~ '\\.jpg\\?') | first | default('') %}
                {% if url %}
                {% set ns.images = ns.images + [{
                  'path': url,
                  'filename': item.content_id ~ '.jpg',
                  'name': item.content_id,
                  'content_id': item.content_id
                }] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.images }}
      
      # Favorites Gallery
      - name: "Frame Art Favorites Gallery"
        unique_id: frame_art_favorites_gallery
        state: >
          {% set list = state_attr('sensor.samsung_frame_art_list', 'content_list') or [] %}
          {% set favorites = list | selectattr('category_id', 'eq', 'MY-C0004') | list %}
          {{ favorites | length }}
        attributes:
          images: >
            {% set urls = (state_attr('sensor.samsung_frame_personal', 'file_urls') or [])
               + (state_attr('sensor.samsung_frame_store', 'file_urls') or [])
               + (state_attr('sensor.samsung_frame_other', 'file_urls') or []) %}
            {% set ns = namespace(images=[]) %}
            {% for item in state_attr('sensor.samsung_frame_art_list', 'content_list') or [] %}
              {% if item.category_id == 'MY-C0004' %}
                {% set subdir = 'personal' if item.content_id.startswith('MY_F') else ('store' if item.content_id.startswith('SAM-') else 'other') %}
                {% set url = urls | select('search', '/' ~ item.content_id ~ '\\.jpg\\?') | first | default('') %}
                {% if url %}
                {% set ns.images = ns.images + [{
                  'path': url,
                  'filename': item.content_id ~ '.jpg',
                  'name': item.content_id,
                  'content_id': item.content_id,
                  'subdirectory': subdir
                }] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.images }}

# ===== INPUT HELPERS =====
input_number:
  # Brightness control slider
  frame_brightness:
    name: Frame TV Brightness
    min: 0
    max: 100
    step: 10
    initial: 50
    icon: mdi:brightness-6

# ===== INPUT SELECTS =====
input_select:
  # Combined matte style selector (for backward compatibility)
  frame_matte:
    name: Frame Style
    options:
      - none
      - shadowbox_polar
      - shadowbox_black
      - flexible_polar
      - flexible_black
      - modernthin_neutral
      - modernthin_black
    initial: shadowbox_polar
    icon: mdi:border-style

  # Matte type selector (separate control)
  frame_matte_type:
    name: Frame Type
    options:
      - none
      - modernthin
      - modern
      - modernwide
      - shadowboxthin
      - shadowbox
      - shadowboxwide
      - panoramic
      - flexible
    initial: shadowbox
    icon: mdi:border-style

  # Matte color selector (separate control)
  frame_matte_color:
    name: Frame Color
    options:
      - black
      - neutral
      - antique
      - warm
      - polar
      - sand
      - seafoam
      - sage
      - burgandy
      - navy
      - apricot
      - byzantine
      - lavender
      - redorange
    initial: polar
    icon: mdi:palette

  # Category selector for filtering
  frame_category:
    name: Frame Category
    options:
      - My Photos
      - Favorites
      - All
    initial: My Photos
    icon: mdi:folder-image
